name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Only PR runs share a group; every other run gets its own so none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  testsuite:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        db-type: [sqlite, mysql, pgsql]
        include:
          - php-version: '8.4'
            db-type: 'sqlite'

    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    steps:
    - uses: actions/checkout@v5

    - name: Setup Service
      if: matrix.db-type == 'mysql'
      run: |
        sudo service mysql start
        mysql -h 127.0.0.1 -u root -proot -e 'CREATE DATABASE cakephp;'

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pdo_${{ matrix.db-type }}, imagick
        coverage: pcov

    # The Azure apt mirror is slow at times; cached .debs skip most of the download.
    - name: Cache Ghostscript packages
      uses: actions/cache@v5
      with:
        path: ~/apt-cache
        key: apt-ghostscript-${{ runner.os }}-22.04-v1

    - name: Install Ghostscript
      timeout-minutes: 10
      run: |
        if ! command -v gs >/dev/null; then
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$HOME/apt-cache" ghostscript
          sudo chown -R "$USER" ~/apt-cache
        fi

    - name: Get composer cache directory
      id: composercache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.composercache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Prepare config
      run: |
        cp config/app_local.ci.php config/app_local.php
        cp config/app_mercure.ci.php config/app_mercure.php

    - name: Composer install
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    # The composer "assets" script and resources/js define what gets built.
    - name: Restore assets
      id: assets-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          webroot/assets
          webroot/css/webfonts
          webroot/css/ccss
          webroot/js/carve-js.min.js
          plugins/Sandbox/webroot/js
          plugins/Sandbox/webroot/css/carve
        key: assets-${{ hashFiles('bower.json', '.bowerrc', 'package.json', 'package-lock.json', 'composer.json', 'resources/js/**') }}

    - name: Assets install
      if: steps.assets-cache.outputs.cache-hit != 'true'
      run: npm install -g bower && bower install --allow-root && composer assets

    # Saved right after the build so files written by later steps stay out of the cache.
    - name: Save assets
      if: steps.assets-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          webroot/assets
          webroot/css/webfonts
          webroot/css/ccss
          webroot/js/carve-js.min.js
          plugins/Sandbox/webroot/js
          plugins/Sandbox/webroot/css/carve
        key: ${{ steps.assets-cache.outputs.cache-primary-key }}

    - name: Run PHPUnit
      run: |
        if [[ ${{ matrix.db-type }} == 'sqlite' ]]; then export DB_URL='sqlite:///:memory:'; fi
        if [[ ${{ matrix.db-type }} == 'mysql' ]]; then export DB_URL='mysql://root:root@127.0.0.1/cakephp'; fi
        if [[ ${{ matrix.db-type }} == 'pgsql' ]]; then export DB_URL='postgres://postgres:postgres@127.0.0.1/postgres'; fi

        # Debug: Check PCOV config before
        php -r 'echo "PCOV directory: " . ini_get("pcov.directory") . "\n";' || true

        # Debug: Check if plugins are loaded
        bin/cake plugin list || true

        if [[ ${{ matrix.php-version }} == '8.4' && ${{ matrix.db-type }} == 'mysql' ]]; then
          php -d pcov.enabled=1 -d pcov.directory=${{ github.workspace }} -d pcov.exclude=~vendor~ vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text 2>&1 | tee phpunit-output.txt
          # Debug: Check coverage.xml for plugin files
          grep -c "plugins/" coverage.xml || echo "No plugin files in coverage!"
        else
          vendor/bin/phpunit
        fi

    - name: Upload coverage.xml artifact
      if: matrix.php-version == '8.4' && matrix.db-type == 'mysql'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          phpunit-output.txt

    - name: Code Coverage Report
      if: success() && matrix.php-version == '8.4' && matrix.db-type == 'mysql'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        root_dir: ${{ github.workspace }}
        fail_ci_if_error: true
        verbose: true

  validation:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl, pdo_sqlite, imagick
        coverage: none

    - name: Get composer cache directory
      id: composercache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.composercache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Prepare config
      run: cp config/app_local.ci.php config/app_local.php

    - name: Prepare DB
      run: echo "DB_URL=sqlite:///:memory:" >> $GITHUB_ENV

    - name: Composer install
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Migrations
      run: composer migrate

    # The composer "assets" script and resources/js define what gets built.
    - name: Restore assets
      id: assets-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          webroot/assets
          webroot/css/webfonts
          webroot/css/ccss
          webroot/js/carve-js.min.js
          plugins/Sandbox/webroot/js
          plugins/Sandbox/webroot/css/carve
        key: assets-${{ hashFiles('bower.json', '.bowerrc', 'package.json', 'package-lock.json', 'composer.json', 'resources/js/**') }}

    - name: Assets install
      if: steps.assets-cache.outputs.cache-hit != 'true'
      run: npm install -g bower && bower install --allow-root && composer assets

    # Saved right after the build so files written by later steps stay out of the cache.
    - name: Save assets
      if: steps.assets-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          webroot/assets
          webroot/css/webfonts
          webroot/css/ccss
          webroot/js/carve-js.min.js
          plugins/Sandbox/webroot/js
          plugins/Sandbox/webroot/css/carve
        key: ${{ steps.assets-cache.outputs.cache-primary-key }}

    - name: DTO check
      run: bin/cake dto generate -v -d && bin/cake dto generate -p Sandbox -v -d

    - name: Code completion generate
      run: bin/cake generate code_completion

    - name: Run phpstan
      run: vendor/bin/phpstan analyse --error-format=github

    - name: Run phpstan tests
      run: vendor/bin/phpstan analyse -c tests/phpstan.neon --error-format=github

    - name: Run annotator
      run:  bin/cake annotate all -r -d --ci

    #- name: Run annotator
    #  run:  bin/cake annotate all -r -d --ci -p all

    - name: Run linter
      run:  bin/cake linter --ci

    - name: Run linter on plugins
      run:  bin/cake linter --ci -p all

    - name: Run phpcs
      run: composer cs-check
